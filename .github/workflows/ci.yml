name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Backend and CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            cli/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: CLI
        working-directory: cli
        run: |
          npm ci
          npm run check
          npm test
          npm run build
