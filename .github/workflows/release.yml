name: Build and Release iOSLab Platform (Unsigned)

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v3.0.0)
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version of the release to publish (e.g., 3.0.0)'
        required: true
        default: '3.0.0'
      tag_name:
        description: 'Git Tag Name to build / associate (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'

jobs:
  build-and-release:
    name: Build macOS app, backend and CLI
    runs-on: macos-latest # Runs on modern macos runner to support native Xcode builds
    permissions:
      contents: write # Explicitly grant write access to push the release assets and tags

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 1. HANDLE DYNAMIC TAGGING (WORKFLOW_DISPATCH)
      # ==========================================
      - name: Verify or Create Git Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Set up Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists in remote
          git fetch --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Git tag '$TAG_NAME' already exists. Reusing existing tag for release build."
          else
            echo "Git tag '$TAG_NAME' does not exist. Creating and pushing new tag from current commit..."
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      # ==========================================
      # 2. SETUP ENVIRONMENT & NODE
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            cli/package-lock.json

      # ==========================================
      # 3. CREATE RELEASE ASSETS DIRECTORY
      # ==========================================
      - name: Prepare Release Directory
        run: |
          mkdir -p release-assets

      # ==========================================
      # 4. PACKAGE BACKEND (WITH WEB DASHBOARD) AND CLI
      # ==========================================
      - name: Package backend and CLI
        run: |
          # Production dependencies only, plus backend/public (the web dashboard).
          ./scripts/package_runtime.sh "$RUNNER_TEMP/packages"

      # ==========================================
      # 5. BUILD NATIVE MACOS APP (UNSIGNED) AND EMBED THE BACKEND
      # ==========================================
      - name: Build and Archive Dashboard App (Unsigned)
        run: |
          xcodebuild archive \
            -project macos-app/IOSLabDashboard.xcodeproj \
            -scheme IOSLabDashboard \
            -configuration Release \
            -archivePath $RUNNER_TEMP/IOSLabDashboard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ENTITLEMENTS=""

      - name: Embed backend and package the app bundle
        run: |
          mkdir -p $RUNNER_TEMP/export
          cp -R $RUNNER_TEMP/IOSLabDashboard.xcarchive/Products/Applications/IOSLabDashboard.app $RUNNER_TEMP/export/
          APP=$RUNNER_TEMP/export/IOSLabDashboard.app

          # The app starts this runtime itself (BackendRuntime looks for backend-runtime/start-backend.sh).
          mkdir -p "$APP/Contents/Resources/backend-runtime"
          cp -R "$RUNNER_TEMP/packages/backend-runtime/." "$APP/Contents/Resources/backend-runtime/"

          cd $RUNNER_TEMP/export
          zip -qr $GITHUB_WORKSPACE/release-assets/IOSLabDashboard.app.zip IOSLabDashboard.app

      - name: Zip backend and CLI
        run: |
          # Asset and folder names are unchanged for existing consumers.
          cd $RUNNER_TEMP/packages
          mv backend-runtime backend-dist
          mv cli-runtime cli-dist
          zip -qr $GITHUB_WORKSPACE/release-assets/ioslab-backend.zip backend-dist
          zip -qr $GITHUB_WORKSPACE/release-assets/ioslab-cli.zip cli-dist

      - name: Keep the assets for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets/*
          if-no-files-found: error

  package-linux:
    name: Build Linux app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev libqt6svg6 \
            cmake ninja-build build-essential pkg-config libgl1-mesa-dev fontconfig fonts-dejavu-core
      - name: Build, test, install
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S linux-app/mobilelab-android -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/stage/mobilelab-android"
          mkdir -p release-assets
          tar -C stage -czf release-assets/MobileLab-linux-x86_64.tar.gz mobilelab-android
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-and-release, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Determine Release Target Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.event.inputs.release_version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          files: |
            release-assets/IOSLabDashboard.app.zip
            release-assets/ioslab-backend.zip
            release-assets/ioslab-cli.zip
            release-assets/MobileLab-linux-x86_64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
